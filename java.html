<!DOCTYPE html>
<html lang="no">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java Treningsleir</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['Space Mono', 'monospace']
          }
        }
      }
    }

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    
        :root {
            --bg-color: #0a0a0a;
            --text-color: #e5e5e5;
            --text-muted: #9ca3af;
            --card-bg: #111111;
            --border-color: #333333;
            --header-bg: #050505;
            --input-bg: #1e1e1e;
            --input-text: #d4d4d4;
            --solution-bg: #111111;
            --solution-heading: #4ade80;
            --feedback-bg: #111111;
            --feedback-border: #f97316;
            --feedback-heading: #fdba74;
            --explanation-bg: #1e152a;
            --explanation-border: #9333ea;
            --explanation-heading: #c084fc;
            --explanation-close: #c084fc;
            --explanation-close-hover: #e9d5ff;
            --generator-feedback-bg: #18181b;
            --code-inline-bg: #2d3748;
            --code-inline-text: #f472b6;
            --hover-border: #555555;
            --primary-color: #f97316;
            --terminal-bg: #1e293b;
            --terminal-header: #334155;
            --terminal-text: #e2e8f0;
        }

        body.light {
            --bg-color: #fafafa;
            --text-color: #111111;
            --text-muted: #4b5563;
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
            --header-bg: #f3f4f6;
            --input-bg: #ffffff;
            --input-text: #111111;
            --solution-bg: #f9fafb;
            --solution-heading: #15803d;
            --feedback-bg: #fff7ed;
            --feedback-border: #f97316;
            --feedback-heading: #c2410c;
            --explanation-bg: #f9f5ff;
            --explanation-border: #9333ea;
            --explanation-heading: #6b21a8;
            --explanation-close: #7e22ce;
            --explanation-close-hover: #581c87;
            --generator-feedback-bg: #f8fafc;
            --code-inline-bg: #e2e8f0;
            --code-inline-text: #db2777;
            --hover-border: #999999;
            --terminal-bg: #f1f5f9;
            --terminal-header: #cbd5e1;
            --terminal-text: #1e293b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.2s, color 0.2s;
        }


    .code-input {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      background-color: var(--input-bg);
      color: var(--input-text);
      width: 100%;
      min-height: 200px;
      max-height: 500px;
      padding: 1rem;
      border-radius: 4px;
      resize: vertical; /* Allow vertical resize */
      border: 1px solid var(--border-color);
      overflow-y: auto; /* Enable scrollbar */
      line-height: 1.4;
    }

    .code-input:focus {
      outline: none;
      border-color: #f97316;
      box-shadow: 0 0 0 1px #f97316;
    }

    /* Custom Scrollbar for code inputs */
    .code-input::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .code-input::-webkit-scrollbar-track {
      background: var(--input-bg);
    }
    .code-input::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }
    .code-input::-webkit-scrollbar-thumb:hover {
      background: var(--hover-border);
    }

    .solution-box {
      background-color: var(--solution-bg);
      border: 1px solid var(--border-color);
      border-left: 4px solid #22c55e;
      display: none;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .solution-heading {
      color: var(--solution-heading);
    }

    .ai-feedback-box {
      background-color: var(--feedback-bg);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--feedback-border);
      display: none;
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 0.25rem;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .ai-explanation-box {
      background-color: var(--explanation-bg) !important;
      border-left-color: var(--explanation-border) !important;
    }

    .feedback-heading {
      color: var(--feedback-heading);
    }

    .explanation-heading {
      color: var(--explanation-heading);
    }

    .explanation-close-btn {
      color: var(--explanation-close);
      background: none;
      border: none;
      cursor: pointer;
    }

    .explanation-close-btn:hover {
      color: var(--explanation-close-hover);
    }

    .generator-feedback-box {
      background-color: var(--generator-feedback-bg);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--primary-color);
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 0.25rem;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .code-display {
      background-color: #1f2937;
      color: #e5e7eb;
      padding: 1rem;
      border-radius: 0;
      font-family: 'Courier New', Courier, monospace;
      overflow-x: auto;
    }

    .loading-spinner {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 2px solid #ffffff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 1s linear infinite;
      margin-right: 0.5rem;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Markdown-like styling for AI response */
    .ai-content p {
      margin-bottom: 0.5rem;
    }

    .ai-content code {
      background-color: var(--code-inline-bg);
      padding: 0.1rem 0.3rem;
      border-radius: 0.2rem;
      font-family: monospace;
      color: var(--code-inline-text);
      transition: background-color 0.2s, color 0.2s;
    }

    .ai-content pre {
      background-color: #1f2937;
      color: white;
      padding: 0.5rem;
      border-radius: 0.3rem;
      overflow-x: auto;
      margin: 0.5rem 0;
    }

    /* === AI Chat Styles === */
    .ai-chat-box {
      border: 1px solid var(--border-color);
      margin-top: 1rem;
      border-radius: 0.25rem;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background-color: var(--card-bg);
      transition: all 0.2s ease;
    }
    
    .ai-chat-header {
      background-color: var(--border-color);
      color: var(--text-color);
      padding: 0.75rem 1rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--border-color);
    }
    
    .ai-chat-messages {
      max-height: 350px;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      background-color: rgba(0, 0, 0, 0.15);
    }
    
    body.light .ai-chat-messages {
      background-color: rgba(0, 0, 0, 0.03);
    }
    
    .chat-bubble {
      max-width: 85%;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      line-height: 1.4;
      position: relative;
      animation: bubbleFadeIn 0.25s ease-out;
    }
    
    @keyframes bubbleFadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .chat-bubble-user {
      align-self: flex-end;
      background-color: var(--primary-color);
      color: #000000;
      border-bottom-right-radius: 0.1rem;
      font-weight: 500;
    }
    
    body.light .chat-bubble-user {
      background-color: var(--primary-color);
      color: #000000;
    }
    
    .chat-bubble-model {
      align-self: flex-start;
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 0.1rem;
    }
    
    .ai-chat-input-area {
      display: flex;
      border-top: 1px solid var(--border-color);
      background-color: var(--input-bg);
    }
    
    .ai-chat-input {
      flex: 1;
      background-color: transparent;
      color: var(--input-text);
      padding: 0.75rem 1rem;
      border: none;
      font-size: 0.85rem;
      resize: none;
      height: 42px;
      line-height: 1.4;
    }
    
    .ai-chat-input:focus {
      outline: none;
    }
    
    .ai-chat-send-btn {
      background: none;
      border: none;
      color: var(--primary-color);
      padding: 0 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }
    
    .ai-chat-send-btn:hover {
      opacity: 0.8;
    }
    
    .ai-chat-send-btn:disabled {
      color: var(--text-muted);
      cursor: not-allowed;
    }

    /* === Progress Dashboard === */
    #progress-dashboard {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 1.25rem 1.5rem;
      margin-bottom: 2rem;
    }

    .progress-bar-bg {
      background: var(--bg-color);
      height: 8px;
      border: 1px solid var(--border-color);
      margin-bottom: 1rem;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: #f97316;
      transition: width 0.4s ease;
    }

    .exercise-dots {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 0.75rem;
    }

    .exercise-dot {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 700;
      background: var(--bg-color);
      color: #6b7280;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Space Mono', monospace;
    }

    .exercise-dot:hover {
      border-color: #f97316;
      color: #f97316;
      transform: scale(1.1);
    }

    .exercise-dot.completed {
      background: #f97316;
      color: #000;
      border-color: #f97316;
    }

    /* === Copy button === */
    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255, 255, 255, 0.12);
      color: #9ca3af;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.7rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      z-index: 10;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      color: white;
    }

    .copy-btn.copied {
      color: #4ade80;
    }

    /* === AI Output Simulator === */
    .output-simulator-box {
      background: #0f172a;
      border: 1px solid #1e3a5f;
      border-radius: 0;
      padding: 1rem;
      margin-top: 0.75rem;
      display: none;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 0.8rem;
    }

    .output-simulator-box .terminal-header {
      color: #64748b;
      font-size: 0.7rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .output-simulator-box .terminal-output {
      color: #e2e8f0;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .output-simulator-box .terminal-output .t-green {
      color: #4ade80;
    }

    .output-simulator-box .terminal-output .t-red {
      color: #f87171;
    }
  </style>

</head>

<body class="bg-[var(--bg-color)] text-[var(--text-color)] pb-20 font-sans">
    <!-- Theme Toggle Button -->
    <button id="theme-toggle" class="fixed bottom-6 left-6 text-[var(--text-color)] hover:scale-110 transition duration-200 flex items-center justify-center cursor-pointer z-50 text-2xl bg-transparent border-0 outline-none p-0" aria-label="Endre fargetema">
        <i class="fa-regular fa-lightbulb"></i>
    </button>

  <!-- Header -->
  <header class="border-b border-[var(--border-color)] p-6 mb-8 bg-[var(--header-bg)]">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-bold tracking-tight"><i class="fa-brands fa-java mr-2"></i> Java Treningsleir </h1>
        <p class="opacity-90 mt-1">Mestrer du OOP? Tren før eksamen! IN1010</p>
      </div>
      <div class="flex flex-col items-end gap-2">
        <a href="index.html" class="border border-gray-700 hover:border-gray-400 text-white px-4 py-2 font-mono text-xs uppercase tracking-wider transition flex items-center bg-[#111]">
          <i class="fa-brands fa-python mr-2 text-lg"></i> Gå til Python
        </a>
        <div class="hidden md:block text-right text-xs opacity-80">
          Eksamensforberedelser
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 space-y-8">

    <!-- Progress Dashboard -->
    <div id="progress-dashboard">
      <div class="flex justify-between items-center mb-2">
        <div class="flex items-center gap-2">
          <i class="fas fa-chart-line text-orange-500"></i>
          <span class="font-bold text-[var(--text-color)] text-sm">Din fremgang</span>
          <span id="progress-label" class="text-xs text-[var(--text-muted)] font-medium">0 / 11 godkjent</span>
        </div>
        <button onclick="resetProgress()" class="text-xs text-[var(--text-muted)] hover:text-red-400 transition"
          title="Nullstill fremgang">
          <i class="fas fa-undo mr-1"></i>Nullstill
        </button>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-bar-fill" style="width:0%"></div>
      </div>
      <div class="exercise-dots" id="exercise-dots"></div>
    </div>

    <!-- Tab Navigation -->
    <div class="flex flex-col md:flex-row justify-center items-center mb-8 gap-4">
      <div class="bg-[var(--card-bg)] border border-[var(--border-color)] p-1 inline-flex">
        <button onclick="showSection('premade')" id="tab-premade"
          class="px-6 py-2 font-mono text-xs uppercase tracking-wider transition-colors duration-200 bg-orange-500 text-black border-r border-[var(--border-color)]">
          <i class="fas fa-list-ol mr-2"></i> IN1010 Oppgaver
        </button>
        <button onclick="showSection('generator')" id="tab-generator"
          class="px-6 py-2 font-mono text-xs uppercase tracking-wider transition-colors duration-200 text-[var(--text-muted)] hover:text-[var(--text-color)]">
          <i class="fas fa-infinity mr-2"></i> Generator
        </button>
      </div>
    </div>

    <!-- Section: Premade Exercises -->
    <div id="premade-section" class="space-y-8">
      <div id="exercise-container" class="space-y-8"></div>
    </div>

    <!-- Section: Generator -->
    <div id="generator-section" class="hidden space-y-8">
      <div
        class="bg-[var(--card-bg)] border border-[var(--border-color)]">
        <div class="p-8">
          <div class="flex items-center mb-6">
            <div class="bg-orange-500 p-3 rounded-full mr-4">
              <i class="fas fa-infinity text-2xl"></i>
            </div>
            <div>
              <h2 class="text-2xl font-bold">Oppgavegenerator </h2>
              <p class="text-[var(--text-muted)]">Trenger du flere nøtter? Generer en ny oppgave!</p>
            </div>
          </div>

          <div class="mb-6">
            <label class="block text-[var(--primary-color)] text-sm font-bold mb-2" for="difficulty">
              Velg vanskelighetsgrad:
            </label>
            <select id="difficulty"
              class="block w-full bg-[var(--bg-color)] border border-[var(--border-color)] text-[var(--text-color)] py-2 px-4 pr-8 rounded leading-tight focus:outline-none focus:bg-[var(--card-bg)] focus:border-[var(--primary-color)]">
              <option value="Lett"> Lett (Grunnleggende)</option>
              <option value="Medium" selected> Medium (Oblig-nivå)</option>
              <option value="Vanskelig"> Vanskelig (Eksamen)</option>
            </select>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <button onclick="generateExercise('Objektorientering')"
              class="bg-[var(--bg-color)] border border-[var(--border-color)] hover:border-[var(--hover-border)] p-4 transition text-left transition hover:border-[var(--primary-color)] group">
              <h3 class="font-bold group-hover:text-[var(--primary-color)]"> Klasser & Objekter</h3>
              <p class="text-xs text-[var(--text-muted)] mt-1">Intro til OOP</p>
            </button>
            <button onclick="generateExercise('Arv og Polymorfisme')"
              class="bg-[var(--bg-color)] border border-[var(--border-color)] hover:border-[var(--hover-border)] p-4 transition text-left transition hover:border-[var(--primary-color)] group">
              <h3 class="font-bold group-hover:text-[var(--primary-color)]"> Arv</h3>
              <p class="text-xs text-[var(--text-muted)] mt-1">Subklasser og Interfaces</p>
            </button>
            <button onclick="generateExercise('Datastrukturer')"
              class="bg-[var(--bg-color)] border border-[var(--border-color)] hover:border-[var(--hover-border)] p-4 transition text-left transition hover:border-[var(--primary-color)] group">
              <h3 class="font-bold group-hover:text-[var(--primary-color)]"> Beholdere</h3>
              <p class="text-xs text-[var(--text-muted)] mt-1">ArrayList, HashMap</p>
            </button>
          </div>

          <div id="generated-container" class="hidden bg-[var(--card-bg)] border border-[var(--border-color)] p-6">
            <h3 class="text-[var(--primary-color)] font-bold mb-2 uppercase text-sm tracking-wide">Din oppgave:</h3>
            <div id="generated-text" class="ai-content text-[var(--text-color)] mb-6 leading-relaxed"></div>

            <textarea id="generated-input" class="code-input mb-4"
              placeholder="// Skriv din Java-løsning her..."></textarea>

            <button onclick="checkGeneratedCode()"
              class="border border-[var(--primary-color)] text-orange-500 hover:bg-orange-500 hover:text-black font-mono text-sm uppercase tracking-wider py-3 px-6 transition duration-200">
              <i class="fas fa-check-circle mr-2"></i> Sjekk løsning
            </button>

            <div id="generated-feedback"
              class="generator-feedback-box hidden">
              <div class="flex justify-between items-center mb-2">
                <h4 class="font-bold text-[var(--primary-color)]"><i class="fas fa-robot mr-2"></i>Tilbakemelding:</h4>
                <div class="flex gap-2">
                  <button onclick="toggleCollapse('generated-feedback-wrapper', 'generated-feedback-chevron')" class="text-[var(--text-muted)] hover:text-[var(--text-color)] transition text-xs font-mono flex items-center gap-1" title="Minimer tilbakemelding">
                    <i class="fas fa-chevron-up transition-transform duration-200" id="generated-feedback-chevron"></i> Minimer
                  </button>
                  <button onclick="document.getElementById('generated-feedback').style.display='none'" class="text-[var(--text-muted)] hover:text-red-500 transition text-xs font-mono flex items-center gap-1" title="Lukk tilbakemelding">
                    <i class="fas fa-times"></i>
                  </button>
                </div>
              </div>
              <div id="generated-feedback-wrapper">
                <div id="generated-feedback-text" class="ai-content text-sm text-[var(--text-color)]"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center mt-12 mb-8 border-t border-[var(--border-color)] pt-6 text-[var(--text-muted)] font-mono text-xs uppercase tracking-widest">
    <p class="mb-2">Lykke til med kodingen!</p>
    <p>© 2026 <a href="https://sivertasskildt.no" target="_blank" class="hover:text-[var(--text-color)] transition underline underline-offset-4">Sivert Asskildt</a></p>
  </footer>

  <script>
    // --- JAVA EXERCISES (IN1010 STYLE) ---
    const exercises = [
      {
        id: 1,
        title: "Person Klasse (Intro)",
        topic: "Klasser",
        difficulty: "Lett",
        description: `Lag en klasse <code>Person</code>.
        <br>1. Den skal ha variablene <code>navn</code> (String) og <code>alder</code> (int).
        <br>2. Lag en konstruktør som setter disse.
        <br>3. Lag en metode <code>skrivUt()</code> som printer "Navn: [navn], Alder: [alder]".
        <br>Skriv også en <code>main</code>-metode som tester klassen.`,
        solution: `class Person {
  String navn;
  int alder;

  public Person(String navn, int alder) {
    this.navn = navn;
    this.alder = alder;
  }

  public void skrivUt() {
    System.out.println("Navn: " + navn + ", Alder: " + alder);
  }

  public static void main(String[] args) {
    Person p = new Person("Ola", 20);
    p.skrivUt();
  }
}`
      },
      {
        id: 2,
        title: "Sum av Liste (Løkker)",
        topic: "ArrayList",
        difficulty: "Lett",
        description: `Lag en metode <code>summer(ArrayList&lt;Integer&gt; tall)</code>.
        <br>Metoden skal returnere summen av alle tallene i listen.
        <br>Bruk en for-løkke (gjerne for-each typen).`,
        solution: `import java.util.ArrayList;

class SumOppgave {
  public static int summer(ArrayList<Integer> tall) {
    int sum = 0;
    for (Integer t : tall) {
      sum += t;
    }
    return sum;
  }

  public static void main(String[] args) {
    ArrayList<Integer> liste = new ArrayList<>();
    liste.add(5);
    liste.add(10);
    System.out.println(summer(liste));
  }
}`
      },
      {
        id: 3,
        title: "Bussbillett (Arv)",

        solution: `import java.util.Iterator;
import java.util.ArrayList;

class TallListe implements Iterable<Integer> {
  private ArrayList<Integer> liste = new ArrayList<>();

  public void leggTil(int x) {
    liste.add(x);
  }

  @Override
  public Iterator<Integer> iterator() {
    return new TallIterator();
  }

  // Indre klasse
  class TallIterator implements Iterator<Integer> {
    private int indeks = 0;

    @Override
    public boolean hasNext() {
      return indeks < liste.size();
    }

    @Override
    public Integer next() {
      return liste.get(indeks++);
    }
  }

    TallListe tl = new TallListe();
    tl.leggTil(10); tl.leggTil(20);
    for (int x : tl) System.out.println(x);
  }

        solution: `class Monitor {
  private int tall = 0;

  public synchronized void opp() {
    tall++;
    notifyAll(); // Vekk de som venter
  }

  public synchronized void ned() {
    while (tall == 0) {
      try {
        wait();
      } catch (InterruptedException e) {}
    }
    tall--;
  }
}

class Arbeider implements Runnable {
  Monitor m;
  public Arbeider(Monitor m) { this.m = m; }
  public void run() {
    m.opp();
    System.out.println("Økte tallet!");
  }
}

class Main {
  public static void main(String[] args) {
    Monitor m = new Monitor();
    new Thread(new Arbeider(m)).start();
  }
}`

    function saveCode(id, code) { localStorage.setItem('java_code_' + id, code); }
    function autoResize(textarea) {
      textarea.style.height = 'auto';
      const targetHeight = Math.min(textarea.scrollHeight, 500);
      textarea.style.height = targetHeight + 'px';
      textarea.style.overflowY = textarea.scrollHeight > 500 ? 'auto' : 'hidden';
    }

    function toggleCollapse(wrapperId, chevronId) {
      const wrapper = document.getElementById(wrapperId);
      const chevron = document.getElementById(chevronId);
      if (!wrapper || !chevron) return;
      
      const isHidden = wrapper.style.display === 'none';
      wrapper.style.display = isHidden ? '' : 'none';
      
      if (isHidden) {
        chevron.classList.remove('fa-chevron-down');
        chevron.classList.add('fa-chevron-up');
        if (wrapperId.startsWith('ai-chat-body-wrapper-')) {
          const id = wrapperId.replace('ai-chat-body-wrapper-', '');
          const messagesDiv = document.getElementById(`ai-chat-messages-${id}`);
          if (messagesDiv) messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
      } else {
        chevron.classList.remove('fa-chevron-up');
        chevron.classList.add('fa-chevron-down');
      }
    }
    function clearCode(id) {
      if (confirm("Slett koden?")) {
        const el = document.getElementById('input' + id);
        el.value = '';
        localStorage.removeItem('java_code_' + id);
        autoResize(el);
      }
    }
    function toggleSolution(id, btn) {
      const sol = document.getElementById(id);
      if (sol.style.display === "block") {
        sol.style.display = "none";
        btn.innerHTML = '<i class="fas fa-eye mr-2"></i> Se fasit';
      } else {
        sol.style.display = "block";
        btn.innerHTML = '<i class="fas fa-eye-slash mr-2"></i> Skjul fasit';
      }
    }

    // === Copy to Clipboard ===
    function copyCode(id) {
      const code = document.getElementById('input' + id).value;
      if (!code.trim()) { alert('Ingen kode å kopiere!'); return; }
      navigator.clipboard.writeText(code).then(() => {
        showCopyFeedback('copy-feedback-' + id);
      });
    }
    function copySolution(id) {
      const code = document.getElementById('solPre' + id)?.innerText || '';
      if (!code.trim()) return;
      navigator.clipboard.writeText(code).then(() => {
        showCopyFeedback('sol-copy-feedback-' + id);
      });
    }
    function showCopyFeedback(id) {
      // Flash the copy button text briefly
      const tmp = document.createElement('div');
      tmp.style.cssText = 'position:fixed;bottom:1.5rem;right:1.5rem;background:#1e293b;color:#4ade80;padding:0.6rem 1.2rem;border-radius:0.5rem;font-size:0.85rem;box-shadow:0 4px 14px rgba(0,0,0,0.3);z-index:9999;opacity:1;transition:opacity 0.4s';
      tmp.innerHTML = '<i class="fas fa-check mr-2"></i> Kopiert!';
      document.body.appendChild(tmp);
      setTimeout(() => { tmp.style.opacity = '0'; setTimeout(() => tmp.remove(), 400); }, 1400);
    }

    // === AI Output Simulator ===
    async function simulateOutput(id) {
      const code = document.getElementById(`input${id}`).value;
      const box = document.getElementById(`outputBox${id}`);
      const out = document.getElementById(`outputText${id}`);
      if (!code.trim()) { alert('Skriv koden din først!'); return; }

      box.style.display = 'block';
      out.innerHTML = '<span style="color:#64748b"> Simulerer kjøring...</span>';

      const prompt = `Du er en Java-kompilator og runtime-simulator. Gitt denne Java-koden, vis BARE hva terminalen ville ha skrevet ut (System.out.println osv.). Ikke forklar, ikke vis koden. Vis kun den rå output-teksten nøyaktig som terminalen ville vist den. Hvis koden ikke kompilerer, skriv "COMPILE ERROR: [årsak]". Kode:\n\`\`\`java\n${code}\n\`\`\``;

      const reply = await callGemini(prompt);
      // Simple terminal rendering
      const escaped = reply.replace(/</g, '&lt;').replace(/>/g, '&gt;');
      out.innerHTML = escaped;
    }

    // === Progress Dashboard ===
    function markCompleted(id) {
      const isDone = localStorage.getItem('java_done_' + id) === '1';
      if (isDone) {
        if (!confirm('Fjern "Godkjent" for Oppgave ' + id + '?')) return;
        localStorage.removeItem('java_done_' + id);
      } else {
        localStorage.setItem('java_done_' + id, '1');
      }
      // Re-render to update badge & ring
      renderExercises();
      // Re-open solution if it was open (skip here for simplicity)
    }

    function updateProgress() {
      const total = exercises.length;
      const done = exercises.filter(ex => localStorage.getItem('java_done_' + ex.id) === '1').length;

      document.getElementById('progress-label').textContent = `${done} / ${total} godkjent`;
      document.getElementById('progress-bar-fill').style.width = `${Math.round(done / total * 100)}%`;

      const dotsEl = document.getElementById('exercise-dots');
      dotsEl.innerHTML = exercises.map(ex => {
        const isDone = localStorage.getItem('java_done_' + ex.id) === '1';
        return `<div class="exercise-dot ${isDone ? 'completed' : ''} cursor-pointer" onclick="scrollToCard(${ex.id})" title="Gå til Oppgave ${ex.id}: ${ex.title}">${ex.id}</div>`;
      }).join('');
    }

    function scrollToCard(id) {
      const card = document.getElementById('card' + id);
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        card.classList.add('ring-4', 'ring-orange-500/50');
        setTimeout(() => {
          card.classList.remove('ring-4', 'ring-orange-500/50');
        }, 1500);
      }
    }

    function resetProgress() {
      if (!confirm('Nullstill all fremgang og slett all lagret kode?')) return;
      exercises.forEach(ex => {
        localStorage.removeItem('java_done_' + ex.id);
        localStorage.removeItem('java_code_' + ex.id);
      });
      renderExercises();
    }

    function showSection(sectionId) {
      document.getElementById('premade-section').classList.toggle('hidden', sectionId !== 'premade');
      document.getElementById('generator-section').classList.toggle('hidden', sectionId !== 'generator');

      const btnPremade = document.getElementById('tab-premade');
      const btnGen = document.getElementById('tab-generator');

      if (sectionId === 'premade') {
        btnPremade.className = "px-6 py-2 font-mono text-xs uppercase tracking-wider transition-colors duration-200 bg-orange-500 text-black border-r border-[var(--border-color)]";
        btnGen.className = "px-6 py-2 font-mono text-xs uppercase tracking-wider transition-colors duration-200 text-[var(--text-muted)] hover:text-[var(--text-color)]";
      } else {
        btnPremade.className = "px-6 py-2 font-mono text-xs uppercase tracking-wider transition-colors duration-200 text-[var(--text-muted)] hover:text-[var(--text-color)] border-r border-[var(--border-color)]";
        btnGen.className = "px-6 py-2 font-mono text-xs uppercase tracking-wider transition-colors duration-200 bg-orange-500 text-black";
      }
    }

    // --- AI API ---
    async function callGemini(promptText) {
      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
        });
        const data = await response.json();
        return data.candidates[0].content.parts[0].text;
      } catch (e) {
        console.error(e);
        return "Feil med AI-tjenesten.";
      }
    }

    function formatAIResponse(text) {
      let formatted = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
      formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      formatted = formatted.replace(/```([\s\S]*?)```/g, '<pre class="bg-gray-800 p-2 rounded text-[var(--text-color)] text-xs my-2 overflow-x-auto">$1</pre>');
      formatted = formatted.replace(/`([^`]+)`/g, '<code class="font-mono text-sm">$1</code>');
      return formatted.replace(/\n/g, '<br>');
    }

    async function checkCodeWithAI(id) {
      const code = document.getElementById(`input${id}`).value;
      const desc = document.getElementById(`desc${id}`).innerText;
      const btn = event.target;
      const contentBox = document.getElementById(`ai-content-${id}`);
      const feedbackBox = document.getElementById(`ai-feedback-${id}`);

      if (!code.trim()) { alert("Skriv kode først!"); return; }

      const oldText = btn.innerHTML;
      btn.innerHTML = '<span class="loading-spinner"></span> Tenker...';
      btn.disabled = true;

      const prompt = `Du er en pedagogisk Java-lærer for studenter i IN1010. 
      Oppgave: "${desc}". 
      Studentens Java-kode: """${code}""". 
      Gi kort og konstruktiv tilbakemelding på norsk. Er det compile errors? Logiske feil? Ros hvis riktig.`;

      const reply = await callGemini(prompt);
      contentBox.innerHTML = formatAIResponse(reply);
      feedbackBox.style.display = 'block';

      // Ensure expanded
      const wrapper = document.getElementById(`ai-content-wrapper-${id}`);
      if (wrapper) wrapper.style.display = '';
      const chevron = document.getElementById(`feedback-chevron-${id}`);
      if (chevron) {
        chevron.classList.remove('fa-chevron-down');
        chevron.classList.add('fa-chevron-up');
      }

      btn.innerHTML = oldText;
      btn.disabled = false;

      // Add to chat history
      const exercise = exercises.find(e => e.id === id);
      const descriptionText = exercise.description.replace(/<[^>]*>?/gm, '');
      const history = getChatHistory(id);
      history.push({
        role: 'user',
        parts: [{ text: `Vennligst sjekk koden min for oppgaven "${exercise.title}". Oppgavebeskrivelse: "${descriptionText}".\nMin kode:\n\`\`\`java\n${code}\n\`\`\`` }]
      });
      history.push({
        role: 'model',
        parts: [{ text: reply }]
      });
      saveChatHistory(id, history);

      // If the chat box is open, re-render it
      const chatBox = document.getElementById('ai-chat-' + id);
      if (chatBox && chatBox.style.display !== 'none') {
        renderChat(id);
      }

      // Auto-mark as completed if AI gives positive feedback
      const lower = reply.toLowerCase();
      // Sanitize negation phrases like "ingen feil", "uten feil" so they don't block positive classification
      const sanitized = lower
        .replace(/ingen\s+feil/g, '')
        .replace(/uten\s+feil/g, '')
        .replace(/ikke\s+noe\s+feil/g, '')
        .replace(/ingen\s+problemer?/g, '')
        .replace(/uten\s+problemer?/g, '')
        .replace(/ingen\s+mangler/g, '')
        .replace(/uten\s+mangler/g, '')
        .replace(/ikke\s+mangler/g, '');

      const isPositive = (sanitized.includes('riktig') || sanitized.includes('bra') || sanitized.includes('korrekt') || sanitized.includes('flott') || sanitized.includes('bra gjort') || sanitized.includes('godkjent') || sanitized.includes('fungerer') || sanitized.includes('ser bra ut'))
        && !sanitized.includes('feil') && !sanitized.includes('error') && !sanitized.includes('mangler') && !sanitized.includes('problem');

      if (isPositive && localStorage.getItem('java_done_' + id) !== '1') {
        localStorage.setItem('java_done_' + id, '1');
        updateProgress();
        // Show green badge without full re-render
        const badge = document.getElementById('completedBadge' + id);
        if (badge) {
          badge.className = "cursor-pointer text-xs font-mono px-2 py-0.5 border transition duration-200 flex items-center gap-1 bg-orange-500 text-black border-[var(--primary-color)] font-bold";
          badge.innerHTML = '<i class="fas fa-check"></i> Godkjent';
          badge.title = "Fjern godkjenning";
        }
        const card = document.getElementById('card' + id);
        if (card) card.classList.add('ring-2', 'ring-green-300');
      }
    }

    async function explainTaskWithAI(id) {
      const exercise = exercises.find(e => e.id === id);
      const box = document.getElementById(`ai-explanation-${id}`);
      const content = document.getElementById(`ai-explanation-content-${id}`);

      box.style.display = 'block';
      content.innerHTML = '<span class="loading-spinner"></span> Analyserer oppgaven...';

      const prompt = `Forklar denne Java-oppgaven enkelt for en nybegynner, uten å gi koden: "${exercise.description.replace(/<[^>]*>?/gm, '')}"`;
      const reply = await callGemini(prompt);
      content.innerHTML = formatAIResponse(reply);

      // Ensure expanded
      const wrapper = document.getElementById(`ai-explanation-content-wrapper-${id}`);
      if (wrapper) wrapper.style.display = '';
      const chevron = document.getElementById(`explanation-chevron-${id}`);
      if (chevron) {
        chevron.classList.remove('fa-chevron-down');
        chevron.classList.add('fa-chevron-up');
      }

      // Add to chat history
      const descriptionText = exercise.description.replace(/<[^>]*>?/gm, '');
      const history = getChatHistory(id);
      history.push({
        role: 'user',
        parts: [{ text: `Kan du forklare oppgaven "${exercise.title}" for meg? Oppgavebeskrivelse: "${descriptionText}".` }]
      });
      history.push({
        role: 'model',
        parts: [{ text: reply }]
      });
      saveChatHistory(id, history);

      // If the chat box is open, re-render it
      const chatBox = document.getElementById('ai-chat-' + id);
      if (chatBox && chatBox.style.display !== 'none') {
        renderChat(id);
      }
    }

    // --- AI CHAT LOGIC ---
    function getChatHistory(id) {
      const history = localStorage.getItem('java_chat_' + id);
      return history ? JSON.parse(history) : [];
    }

    function saveChatHistory(id, history) {
      localStorage.setItem('java_chat_' + id, JSON.stringify(history));
    }

    function toggleChat(id) {
      const chatBox = document.getElementById('ai-chat-' + id);
      const isHidden = chatBox.style.display === 'none';
      chatBox.style.display = isHidden ? 'flex' : 'none';

      if (isHidden) {
        renderChat(id);
        const inputField = document.getElementById('ai-chat-input-' + id);
        if (inputField) {
          inputField.focus();
        }
      }
    }

    function cleanUserMessageForDisplay(text) {
      const idx = text.indexOf(']\n\n');
      if (idx !== -1) {
        return text.substring(idx + 3);
      }
      return text;
    }

    function renderChat(id) {
      const messagesDiv = document.getElementById(`ai-chat-messages-${id}`);
      if (!messagesDiv) return;

      messagesDiv.innerHTML = '';
      const history = getChatHistory(id);

      if (history.length === 0) {
        // Welcome message
        messagesDiv.innerHTML = `
          <div class="chat-bubble chat-bubble-model font-sans">
            Hei! Jeg er din AI-veileder. Har du spørsmål til oppgaven, koden din, eller tilbakemeldingen? Spør i vei! 😊
          </div>
        `;
      } else {
        history.forEach(msg => {
          const bubble = document.createElement('div');
          if (msg.role === 'user') {
            bubble.className = 'chat-bubble chat-bubble-user font-sans';
            bubble.textContent = cleanUserMessageForDisplay(msg.parts[0].text);
          } else {
            bubble.className = 'chat-bubble chat-bubble-model font-sans';
            bubble.innerHTML = formatAIResponse(msg.parts[0].text);
          }
          messagesDiv.appendChild(bubble);
        });
      }
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function sendChatMessage(id) {
      const inputField = document.getElementById(`ai-chat-input-${id}`);
      const sendBtn = document.getElementById(`ai-chat-send-${id}`);
      if (!inputField || !sendBtn) return;

      const userText = inputField.value.trim();
      if (!userText) return;

      // Clear input & disable UI
      inputField.value = '';
      inputField.disabled = true;
      sendBtn.disabled = true;

      const userCode = document.getElementById(`input${id}`).value.trim();
      const exercise = exercises.find(e => e.id === id);
      const descriptionText = exercise.description.replace(/<[^>]*>?/gm, '');

      const history = getChatHistory(id);

      // Construct system/context prompt
      let textToSend = "";
      // If no messages or first user turn, prep task description
      if (history.length === 0) {
        textToSend += `Jeg jobber med oppgaven "${exercise.title}".\nOppgavebeskrivelse: "${descriptionText}".\n`;
      }
      if (userCode) {
        textToSend += `[Min nåværende kode:\n\`\`\`java\n${userCode}\n\`\`\`]\n\n`;
      }
      textToSend += userText;

      history.push({
        role: 'user',
        parts: [{ text: textToSend }]
      });

      saveChatHistory(id, history);
      renderChat(id);

      // Show temporary loading state inside bubble
      const messagesDiv = document.getElementById(`ai-chat-messages-${id}`);
      const loadingBubble = document.createElement('div');
      loadingBubble.className = 'chat-bubble chat-bubble-model font-sans opacity-70';
      loadingBubble.innerHTML = '<span class="loading-spinner border-orange-500"></span> Tenker...';
      messagesDiv.appendChild(loadingBubble);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: history })
        });

        if (loadingBubble.parentNode) {
          loadingBubble.remove();
        }

        if (!response.ok) throw new Error('API returnerte feil');

        const data = await response.json();
        if (data.candidates && data.candidates[0].content) {
          const aiText = data.candidates[0].content.parts[0].text;
          history.push({
            role: 'model',
            parts: [{ text: aiText }]
          });
          saveChatHistory(id, history);
          renderChat(id);
        } else {
          alert('Kunne ikke hente svar fra AI-en.');
        }
      } catch (error) {
        console.error("Chat error:", error);
        if (loadingBubble.parentNode) {
          loadingBubble.remove();
        }
        alert('Tilkoblingsfeil. Kunne ikke kontakte AI-veilederen.');
      } finally {
        inputField.disabled = false;
        sendBtn.disabled = false;
        inputField.focus();
      }
    }

    function handleChatKeyDown(id, event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendChatMessage(id);
      }
    }

    function clearChat(id) {
      if (confirm("Er du sikker på at du vil slette hele samtalehistorikken for denne oppgaven?")) {
        localStorage.removeItem('java_chat_' + id);
        renderChat(id);
      }
    }

    async function generateExercise(topic) {
      const diff = document.getElementById('difficulty').value;
      const textArea = document.getElementById('generated-text');
      const container = document.getElementById('generated-container');

      container.classList.remove('hidden');
      textArea.innerHTML = '<span class="loading-spinner"></span> Genererer Java-oppgave...';

      const prompt = `Lag en kort Java-oppgave om "${topic}". 
      Nivå: ${diff}. 
      Fokus: Objektorientering (IN1010). 
      Kun oppgavetekst.`;

      const text = await callGemini(prompt);
      container.dataset.currentTask = text;
      textArea.innerHTML = formatAIResponse(text);
    }

    async function checkGeneratedCode() {
      const code = document.getElementById('generated-input').value;
      const task = document.getElementById('generated-container').dataset.currentTask;
      const feedback = document.getElementById('generated-feedback-text');
      const area = document.getElementById('generated-feedback');

      if (!code.trim()) return;

      area.classList.remove('hidden');
      feedback.innerHTML = '<span class="loading-spinner"></span> Sjekker Java-koden...';

      const prompt = `Du er Java-lærer. Oppgave: "${task}". Svar: """${code}""". Gi tilbakemelding.`;
      const reply = await callGemini(prompt);
      feedback.innerHTML = formatAIResponse(reply);

      // Ensure expanded
      const wrapper = document.getElementById('generated-feedback-wrapper');
      if (wrapper) wrapper.style.display = '';
      const chevron = document.getElementById('generated-feedback-chevron');
      if (chevron) {
        chevron.classList.remove('fa-chevron-down');
        chevron.classList.add('fa-chevron-up');
      }
    }

    document.addEventListener('DOMContentLoaded', renderExercises);

    // Tab-håndtering: sett inn 4 mellomrom i stedet for å hoppe til neste element
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Tab' && e.target.tagName === 'TEXTAREA') {
        e.preventDefault();
        const ta = e.target;
        const start = ta.selectionStart;
        const end = ta.selectionEnd;
        const spaces = '  '; // 4 mellomrom
        ta.value = ta.value.substring(0, start) + spaces + ta.value.substring(end);
        ta.selectionStart = ta.selectionEnd = start + spaces.length;
        // Lagre kode hvis det er en kode-input med id på formen "input<tall>"
        const match = ta.id.match(/^input(\d+)$/);
        if (match) saveCode(parseInt(match[1]), ta.value);
        autoResize(ta);
      }
    });
  
        // --- THEME TOGGLE LOGIC ---
        const themeToggleBtn = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('theme') || 'dark';
        
        if (currentTheme === 'light') {
            document.body.classList.add('light');
            themeToggleBtn.innerHTML = '<i class="fa-solid fa-lightbulb"></i>';
        } else {
            themeToggleBtn.innerHTML = '<i class="fa-regular fa-lightbulb"></i>';
        }

        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('light');
            let theme = 'dark';
            if (document.body.classList.contains('light')) {
                theme = 'light';
                themeToggleBtn.innerHTML = '<i class="fa-solid fa-lightbulb"></i>';
            } else {
                themeToggleBtn.innerHTML = '<i class="fa-regular fa-lightbulb"></i>';
            }
            localStorage.setItem('theme', theme);
        });
    </script>
